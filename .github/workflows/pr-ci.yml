name: pr-ci

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'agents/**'
      - 'README.md'

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-latest

      - name: Test
        run: cargo test --locked
