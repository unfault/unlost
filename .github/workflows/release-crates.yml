name: release-crates

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run cargo publish --dry-run only'
        required: true
        default: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Ensure Cargo.toml has license
        run: |
          python - <<'PY'
          import tomllib
          with open('Cargo.toml','rb') as f:
              data = tomllib.load(f)
          pkg = data.get('package', {})
          if 'license' not in pkg and 'license-file' not in pkg:
              raise SystemExit('Cargo.toml missing [package].license or [package].license-file (required for crates.io publish)')
          print('ok')
          PY

      - name: Publish (dry-run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --dry-run

      - name: Publish
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
