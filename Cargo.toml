[workspace]
members = [".", "internal/bench"]

[package]
name = "unlost"
version = "0.2.7"
edition = "2024"
authors = ["Sylvain Hellegouarch <sylvain@unfault.dev>"]
description = "Unlost - Local-first code memory for a workspace."
repository = "https://github.com/unfault/unlost"
homepage = "https://unfault.dev"
documentation = "https://docs.rs/unlost"
license = "MIT"
keywords = ["cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"


[dependencies]
# Data & Logic
anyhow = "1.0.100"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
bytes = "1.10.1"
flate2 = "1.1.8"
futures-util = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "server", "http1"] }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "rustls-native-certs"] }
hyper-util = { version = "0.1.17", features = ["client", "client-legacy", "http1", "tokio"] }
fastembed = { version = "5.8.1", default-features = false, features = ["hf-hub-rustls-tls"] }
ignore = "0.4.23"
indicatif = "0.17.11"
kanal = "0.1.1"
lancedb = { version = "0.23.1", default-features = false }
arrow-array = "56.2.0"
arrow-schema = "56.2.0"
ort = { version = "2.0.0-rc.11", default-features = false, features = [
  "std",
  "ndarray",
  "tracing",
  "download-binaries",
  "copy-dylibs",
  "tls-rustls",
] }
tokenizers = { version = "0.20.4", default-features = false, features = ["onig"] }
uuid = { version = "1.18.1", features = ["v4"] }
unfault-core = "0.1.7"
petgraph = "0.8"
sha2 = "0.10.9"
hex = "0.4.3"
regex = "1.11.2"
rig-core = { version = "0.29.0", default-features = false, features = ["derive", "reqwest-rustls"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
schemars = "1.2.0"
serde = "1.0.228"
serde_json = "1.0.143"
tracing = "0.1.41"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Network & Security
tokio = { version = "1.49.0", features = ["full"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
# Keep the release binary small while staying self-contained.
strip = true
lto = "thin"
codegen-units = 1
